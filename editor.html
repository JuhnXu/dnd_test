<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DND 战棋战斗 Demo v18.2.5 关卡编辑器</title>
  <link rel="stylesheet" href="./src/style.css" />
</head>
<body>
  <div class="app level-editor-page">
    <div class="board-wrap">
      <div id="turnBanner" class="turn-banner"></div>
      <canvas id="battleCanvas" width="640" height="640"></canvas>
      <div id="tooltip" class="tooltip hidden"></div>
    </div>
    <aside class="panel">
      <h1>DND 关卡编辑器 v18.2.5</h1>
      <div class="top-links">
        <a href="./index.html">进入游玩界面</a>
        <a href="./unit-editor.html">单位编辑器</a>
      </div>
      <div class="hint">关卡编辑器只负责地图、地形和出生点。左侧“已编辑单位数据列表”点击单位后，再点击棋盘即可添加到场景。</div>
      <div class="level-info" id="levelInfo"></div>
      <div class="status" id="status"></div>

      <details class="debug-panel" open>
        <summary>关卡编辑工具</summary>
        <div class="debug-toolbar">
          <label><input type="checkbox" id="dbgCoords" checked>坐标</label>
          <label><input type="checkbox" id="dbgTerrain" checked>地形ID</label>
          <label><input type="checkbox" id="dbgMoveCost">移动成本</label>
          <label><input type="checkbox" id="dbgReachable">可达格</label>
          <label><input type="checkbox" id="dbgEditMode" checked>启用编辑</label>
        </div>
        <div class="debug-toolbar">
          <label>编辑模式
            <select id="dbgEditKind">
              <option value="terrain">地形</option>
              <option value="playerSpawn">玩家出生点</option>
              <option value="enemySpawn">敌人出生点</option>
            </select>
          </label>
          <label>地形
            <select id="dbgTerrainSelect">
              <option value="0">普通</option>
              <option value="1">障碍</option>
              <option value="2">困难</option>
              <option value="3">伤害</option>
              <option value="4">治疗</option>
              <option value="5">目标区域</option>
            </select>
          </label>
          <label>当前待放置单位
            <select id="dbgSpawnUnitSelect"></select>
          </label>
          <button id="dbgRefresh">刷新</button>
        </div>

        <h2>已编辑单位数据列表</h2>
        <div class="hint small-hint">点击单位卡片进入放置模式；蓝色为玩家出生点，红色为敌人出生点。右键棋盘出生点可删除。</div>
        <div id="unitDataCatalog" class="unit-data-catalog"></div>

        <p class="debug-note">操作：选择地形后点击棋盘可绘制地形；点击单位卡片后点击棋盘可添加该单位出生点；右键出生点可删除。单位属性请到“单位编辑器”修改。</p>

        <h2>导入 / 保存 / 校验</h2>
        <div class="debug-toolbar">
          <button id="dbgSaveLocal">保存到浏览器</button>
          <button id="dbgLoadLocal">读取浏览器保存</button>
          <button id="dbgClearLocal">恢复默认数据</button>
          <button id="dbgValidateData">校验数据</button>
        </div>
        <div class="debug-toolbar">
          <label>导入数据类型
            <select id="dbgImportType">
              <option value="levels">levels.json</option>
              <option value="units">units.json</option>
              <option value="skills">skills.json</option>
              <option value="spells">spells.json</option>
              <option value="classFeatures">classFeatures.json</option>
              <option value="project">完整项目数据包</option>
            </select>
          </label>
          <input type="file" id="dbgImportFile" accept="application/json,.json" />
          <button id="dbgImportJson">导入 JSON</button>
          <button id="dbgCopyProject">复制完整数据包</button>
          <button id="dbgDownloadProject">下载完整数据包</button>
        </div>
        <div class="debug-info" id="debugInfo"></div>
        <div class="debug-toolbar">
          <button id="dbgCopyLevel">复制关卡 JSON</button>
          <button id="dbgDownloadLevel">下载关卡 JSON</button>
        </div>
        <textarea class="debug-output" id="debugOutput" spellcheck="false"></textarea>
      </details>

      <div style="display:none">
        <button id="moveBtn">移动模式</button><button id="attackBtn">攻击模式</button><button id="skillBtn">技能模式</button><button id="defendBtn">防御动作</button><button id="endTurnBtn">结束回合</button><button id="restartBtn">重新开始</button><button id="nextLevelBtn">下一关</button>
        <div id="confirmPanel"></div><div id="skillList"></div><div id="initiativeList"></div><div id="unitList"></div><div id="log"></div>
      </div>
    </aside>
  </div>
  <script type="module" src="./src/editorMain.js"></script>
</body>
</html>
