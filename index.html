<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DND 战棋战斗 Demo - 模块化版</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #1f2937;
      color: #f9fafb;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 24px;
    }
    .app { display: grid; grid-template-columns: auto 360px; gap: 20px; max-width: 1100px; width: 100%; }
    .board-wrap, .panel { background: #111827; border: 1px solid #374151; border-radius: 16px; box-shadow: 0 16px 40px rgba(0,0,0,.35); padding: 16px; }
    canvas { display: block; background: #0f172a; border-radius: 10px; cursor: pointer; }
    h1 { font-size: 22px; margin: 0 0 8px; }
    h2 { font-size: 16px; margin: 18px 0 8px; color: #d1d5db; }
    .hint { color: #9ca3af; line-height: 1.55; font-size: 14px; margin-bottom: 12px; }
    .status { padding: 12px; border-radius: 12px; background: #1f2937; border: 1px solid #374151; margin: 12px 0; line-height: 1.6; }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 12px 0; }
    button { border: 0; border-radius: 10px; padding: 10px 12px; font-weight: 700; color: #111827; background: #93c5fd; cursor: pointer; }
    button:hover:not(:disabled) { filter: brightness(1.08); }
    button:disabled { opacity: .45; cursor: not-allowed; }
    .unit-list { display: grid; gap: 8px; }
    .unit-card { padding: 10px; border-radius: 10px; background: #1f2937; border: 1px solid #374151; font-size: 14px; }
    .unit-card.active { border-color: #facc15; box-shadow: 0 0 0 2px rgba(250,204,21,.18); }
    .unit-card.dead { opacity: .45; text-decoration: line-through; }
    .log { height: 260px; overflow: auto; padding: 10px; border-radius: 10px; background: #030712; border: 1px solid #374151; font-size: 13px; line-height: 1.55; }
    .log div { margin-bottom: 6px; }
    .player { color: #60a5fa; }
    .enemy { color: #f87171; }
    .system { color: #facc15; }
  </style>
</head>
<body>
  <div class="app">
    <div class="board-wrap">
      <canvas id="battleCanvas" width="640" height="640"></canvas>
    </div>
    <aside class="panel">
      <h1>DND 2D 战棋 Demo</h1>
      <div class="hint">规则简化：d20 + 攻击加值 ≥ AC 则命中。攻击命中后投伤害骰。玩家单位可移动一次、攻击一次，然后结束回合。</div>
      <div class="status" id="status"></div>
      <div class="actions">
        <button id="moveBtn">移动模式</button>
        <button id="attackBtn">攻击模式</button>
        <button id="endTurnBtn">结束回合</button>
        <button id="restartBtn">重新开始</button>
      </div>
      <h2>单位</h2>
      <div class="unit-list" id="unitList"></div>
      <h2>战斗日志</h2>
      <div class="log" id="log"></div>
    </aside>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
