<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DND 战棋战斗 Demo v18</title>
  <link rel="stylesheet" href="./src/style.css" />
</head>
<body>
  <div class="app">
    <div class="board-wrap">
      <div id="turnBanner" class="turn-banner"></div>
      <canvas id="battleCanvas" width="640" height="640"></canvas>
      <div id="tooltip" class="tooltip hidden"></div>
      <details class="debug-panel" id="debugPanel" open>
        <summary>v18 Debug / 地图编辑工具</summary>
        <div class="debug-toolbar">
          <label><input type="checkbox" id="dbgCoords" checked> 坐标</label>
          <label><input type="checkbox" id="dbgTerrain" checked> 地形</label>
          <label><input type="checkbox" id="dbgMoveCost"> 移动成本</label>
          <label><input type="checkbox" id="dbgReachable"> 可达格</label>
          <label><input type="checkbox" id="dbgEditMode"> 编辑地形</label>
        </div>
        <div class="debug-toolbar">
          <select id="dbgTerrainSelect">
            <option value="0">普通地形</option>
            <option value="1">障碍物</option>
            <option value="2">困难地形</option>
            <option value="3">伤害地形</option>
            <option value="4">治疗地形</option>
            <option value="5">目标区域</option>
          </select>
          <button id="dbgRefresh">刷新数据</button>
          <button id="dbgCopyLevel">复制关卡 JSON</button>
          <button id="dbgDownloadLevel">下载 JSON</button>
        </div>
        <div id="debugInfo" class="debug-info"></div>
        <textarea id="debugOutput" class="debug-output" readonly placeholder="这里会显示当前单位、格子、寻路和关卡 JSON"></textarea>
      </details>
    </div>
    <aside class="panel">
      <h1>DND 2D 战棋 Demo v18</h1>
      <div class="hint">v18 新增：Debug 面板、地形/寻路调试、简易地图编辑和 JSON 导出。</div>
      <div class="level-info" id="levelInfo"></div>
      <div class="status" id="status"></div>
      <div class="actions">
        <button id="moveBtn">移动模式</button>
        <button id="attackBtn">攻击模式</button>
        <button id="skillBtn">技能模式</button>
        <button id="defendBtn">防御动作</button>
        <button id="endTurnBtn">结束回合</button>
        <button id="restartBtn">重新开始</button>
        <button id="nextLevelBtn">下一关</button>
      </div>
      <h2>行动确认</h2><div class="confirm-panel" id="confirmPanel"></div>
      <h2>技能</h2><div class="skill-list" id="skillList"></div>
      <h2>先攻顺序</h2><div class="initiative-list" id="initiativeList"></div>
      <h2>单位</h2><div class="unit-list" id="unitList"></div>
      <h2>战斗日志</h2><div class="log" id="log"></div>
    </aside>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
