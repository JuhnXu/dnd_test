<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DND 战棋战斗 Demo v2</title>
  <link rel="stylesheet" href="./src/style.css" />
</head>
<body>
  <div class="app">
    <div class="board-wrap">
      <canvas id="battleCanvas" width="640" height="640"></canvas>
    </div>

    <aside class="panel">
      <h1>DND 2D 战棋 Demo v2</h1>
      <div class="hint">
        v2 新增：先攻排序、d20 暴击/大失败、BFS 移动范围、障碍物。点击蓝色高亮格移动，点击红色高亮敌人攻击。
      </div>

      <div class="status" id="status"></div>

      <div class="actions">
        <button id="moveBtn">移动模式</button>
        <button id="attackBtn">攻击模式</button>
        <button id="endTurnBtn">结束回合</button>
        <button id="restartBtn">重新开始</button>
      </div>

      <h2>先攻顺序</h2>
      <div class="initiative-list" id="initiativeList"></div>

      <h2>单位</h2>
      <div class="unit-list" id="unitList"></div>

      <h2>战斗日志</h2>
      <div class="log" id="log"></div>
    </aside>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
