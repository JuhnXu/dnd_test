<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DND 战棋战斗 Demo v18.2.2</title>
  <link rel="stylesheet" href="./src/style.css" />
</head>
<body>
  <div class="app">
    <div class="board-wrap">
      <div id="turnBanner" class="turn-banner"></div>
      <canvas id="battleCanvas" width="640" height="640"></canvas>
      <div id="tooltip" class="tooltip hidden"></div>
    </div>
    <aside class="panel">
      <h1>DND 2D 战棋 Demo v18.2</h1>
      <div class="hint">v18.2.2：游玩界面默认隐藏坐标、地形 ID、移动成本等调试地图信息。</div>
      <div class="level-info" id="levelInfo"></div>
      <div class="status" id="status"></div>
      <div class="actions">
        <button id="moveBtn">移动模式</button>
        <button id="attackBtn">攻击模式</button>
        <button id="skillBtn">技能模式</button>
        <button id="defendBtn">防御动作</button>
        <button id="endTurnBtn">结束回合</button>
        <button id="restartBtn">重新开始</button>
        <button id="nextLevelBtn">下一关</button>
      </div>
      <h2>行动确认</h2><div class="confirm-panel" id="confirmPanel"></div>
      <h2>技能</h2><div class="skill-list" id="skillList"></div>
      <h2>先攻顺序</h2><div class="initiative-list" id="initiativeList"></div>
      <h2>单位</h2><div class="unit-list" id="unitList"></div>
      <h2>战斗日志</h2><div class="log" id="log"></div>
      <div class="top-links"><a href="./editor.html">打开数据编辑器</a></div>


    </aside>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
