<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DND 战棋战斗 Demo v13</title>
  <link rel="stylesheet" href="./src/style.css" />
</head>
<body>
  <div class="app">
    <div class="board-wrap">
      <div id="turnBanner" class="turn-banner"></div>
      <canvas id="battleCanvas" width="640" height="640"></canvas>
      <div id="tooltip" class="tooltip hidden"></div>
    </div>
    <aside class="panel">
      <h1>DND 2D 战棋 Demo v13</h1>
      <div class="hint">v13 新增：完整行动经济、附赠动作、反应、疾走、脱离、闪避和机会攻击。</div>
      <div class="status" id="status"></div>
      <div class="actions">
        <button id="moveBtn">移动模式</button>
        <button id="attackBtn">攻击模式</button>
        <button id="skillBtn">技能模式</button>
        <button id="defendBtn">闪避/防御</button>
        <button id="dashBtn">疾走</button>
        <button id="disengageBtn">脱离</button>
        <button id="endTurnBtn">结束回合</button>
        <button id="restartBtn">重新开始</button>
      </div>
      <h2>行动确认</h2><div class="confirm-panel" id="confirmPanel"></div>
      <h2>技能</h2><div class="skill-list" id="skillList"></div>
      <h2>先攻顺序</h2><div class="initiative-list" id="initiativeList"></div>
      <h2>单位</h2><div class="unit-list" id="unitList"></div>
      <h2>战斗日志</h2><div class="log" id="log"></div>
    </aside>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
